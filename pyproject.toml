[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlscope"
version = "0.1.0"
description = "Synthetic audit analytics and evidence-grounded finding review"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Shamsheer Abdul Rahiman"}]
dependencies = []

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3.25", "google-genai>=1.0", "dbt-bigquery>=1.8"]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3"]

[project.scripts]
controlscope = "controlscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
controlscope = ["dashboard_template.html"]
