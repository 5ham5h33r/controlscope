name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests_unit
      - run: pytest -q tests_unit
      - run: sqlfluff lint models tests --dialect bigquery --ignore-local-config --config .sqlfluff
      - run: sqlfluff parse models --dialect bigquery --ignore-local-config --config .sqlfluff > /dev/null
      - run: sqlfluff parse tests --dialect bigquery --ignore-local-config --config .sqlfluff > /dev/null
  cloud:
    runs-on: ubuntu-latest
    needs: local
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_DATASET: ${{ vars.GCP_DATASET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[cloud]"
      - name: BigQuery dbt integration
        shell: bash
        run: |
          if [[ -z "$GCP_SERVICE_ACCOUNT_JSON" || -z "$GCP_PROJECT" || -z "$GCP_DATASET" ]]; then
            echo "Cloud integration skipped: configure GCP_SERVICE_ACCOUNT_JSON, GCP_PROJECT, GCP_DATASET"
            exit 0
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp.json"
          mkdir -p "$RUNNER_TEMP/dbt"
          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<EOF
          controlscope:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                keyfile: $RUNNER_TEMP/gcp.json
                project: $GCP_PROJECT
                dataset: $GCP_DATASET
                threads: 4
                location: US
          EOF
          controlscope generate
          controlscope --db data/controlscope.sqlite run
          controlscope upload-bigquery --project "$GCP_PROJECT" --dataset "$GCP_DATASET"
          dbt seed --profiles-dir "$RUNNER_TEMP/dbt"
          dbt run --profiles-dir "$RUNNER_TEMP/dbt"
          dbt test --profiles-dir "$RUNNER_TEMP/dbt"
          controlscope publish-bigquery --project "$GCP_PROJECT" --dataset "$GCP_DATASET"
